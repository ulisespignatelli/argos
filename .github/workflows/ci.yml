name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar
        run: pip install -e ".[dev]"
      - name: Linter (incluye reglas de seguridad de Bandit)
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Auditoría de dependencias
        run: pip-audit .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar
        run: npm ci
      - name: Tipos y build
        run: npm run build
      - name: Auditoría de dependencias (falla solo con vulnerabilidades críticas)
        run: npm audit --audit-level=critical

  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Buscar claves filtradas en el historial
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
