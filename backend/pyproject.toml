[project]
name = "argos-backend"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=13",   # WebSocket para uvicorn (sin los extras [standard], que traen PyYAML)
    "watchfiles>=0.20", # para --reload
    "httpx>=0.27",
    "defusedxml>=0.7",  # lectura segura de RSS/Atom (sin entidades externas ni bombas XML)
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.17.5", "pip-audit>=2.7"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# E/F: errores basicos, I: orden de imports, B: bugs comunes, UP: sintaxis moderna, S: seguridad (bandit)
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S311", "B008"]   # assert en tests, random no criptografico en la demo, Depends() en FastAPI

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E731"]
